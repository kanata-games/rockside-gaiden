<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0914;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;

body{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000;}
#pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;z-index:2;}
.btn{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  color:#dcd6ff;font:800 16px/1 system-ui,-apple-system,sans-serif;letter-spacing:1px;
  border:3px solid #4e4876;background:#1d1a30;box-shadow:0 6px 0 #07060e;
  transition:transform 45ms,background-color 45ms,box-shadow 45ms;pointer-events:none;}
.btn svg{width:46%;height:46%;}
.btn.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 #07060e;color:#fff;}
.dpad{border-radius:20px;}
.dpad.on{background:#5a4cc0;border-color:#c8bcff;}
.round{border-radius:50%;}
#bV{border-color:#4aa8d8;background:#122636;font-size:18px;}
#bV.on{background:#2f8fd0;border-color:#c8f0ff;}
#bS{border-color:#b85eb0;background:#2a1630;}
#bS.on{background:#c04ab8;border-color:#ffc8f4;}
#bJ{border-color:#5aa878;background:#15261c;}
#bJ.on{background:#3fb068;border-color:#c8ffd8;}
#bMap{border:2px solid #8a7cc8;background:#1e1a36;color:#e6deff;border-radius:12px;font:800 11px/1 system-ui,sans-serif;pointer-events:auto;z-index:5;touch-action:none;}
#bMap.on{background:#5a4ca8;border-color:#fff;}
#mute{position:absolute;box-sizing:border-box;padding:0 10px;height:30px;border-radius:15px;text-align:center;
  border:2px solid #3e3866;background:#15122a;color:#a8a0d8;font:700 12px/26px system-ui,sans-serif;letter-spacing:1px;
  pointer-events:auto;white-space:nowrap;z-index:5;}
#mute.off{color:#ff8a8a;border-color:#6a3040;}
#hint{position:absolute;left:0;width:100%;text-align:center;color:#4a4470;font:600 11px/1.3 system-ui,sans-serif;pointer-events:none;letter-spacing:1px;}
body.land .btn{opacity:.6;}
body.land .btn.on{opacity:.9;}
body.land #hint{display:none;}
</style>

  }

//    crash   : a shadow follows Kanata, flashes red (locks) -> the chandelier drops, floor shockwaves (jump)
