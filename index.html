<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0914;

  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
body{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000;}
#pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;z-index:2;}
.btn{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  color:#dcd6ff;font:800 16px/1 system-ui,-apple-system,sans-serif;letter-spacing:1px;
  border:3px solid #4e4876;background:#1d1a30;box-shadow:0 6px 0 #07060e;
  transition:transform 45ms,background-color 45ms,box-shadow 45ms;pointer-events:none;}
.btn svg{width:46%;height:46%;}
.btn.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 #07060e;color:#fff;}
.dpad{border-radius:20px;}
.dpad.on{background:#5a4cc0;border-color:#c8bcff;}
.round{border-radius:50%;}
#bV{border-color:#4aa8d8;background:#122636;font-size:18px;}
#bV.on{background:#2f8fd0;border-color:#c8f0ff;}
#bS{border-color:#b85eb0;background:#2a1630;}
#bS.on{background:#c04ab8;border-color:#ffc8f4;}
#bJ{border-color:#5aa878;background:#15261c;}
#bJ.on{background:#3fb068;border-color:#c8ffd8;}
#bMap{border:2px solid #8a7cc8;background:#1e1a36;color:#e6deff;border-radius:12px;font:800 11px/1 system-ui,sans-serif;pointer-events:auto;z-index:5;touch-action:none;}
#bMap.on{background:#5a4ca8;border-color:#fff;}
#mute{position:absolute;box-sizing:border-box;padding:0 10px;height:30px;border-radius:15px;text-align:center;
  border:2px solid #3e3866;background:#15122a;color:#a8a0d8;font:700 12px/26px system-ui,sans-serif;letter-spacing:1px;
  pointer-events:auto;white-space:nowrap;z-index:5;}
#mute.off{color:#ff8a8a;border-color:#6a3040;}
#hint{position:absolute;left:0;width:100%;text-align:center;color:#4a4470;font:600 11px/1.3 system-ui,sans-serif;pointer-events:none;letter-spacing:1px;}
#msg{position:absolute;box-sizing:border-box;padding:6px 12px;border:2px solid #3e3866;border-radius:10px;background:#120f24;color:#e8e2ff;
  font:700 13px/1.45 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;
  pointer-events:none;overflow:hidden;z-index:3;}
#msg .area{font-size:11px;color:#a8a0d8;letter-spacing:1px;}
#msg .room{font-size:15px;color:#fff4e0;}
#msg .tip{color:#bff4ff;}
body.land #msg{display:none;}
body.land .btn{opacity:.6;}
body.land .btn.on{opacity:.9;}
body.land #hint{display:none;}
</style>
</head>

    gx = Math.round((W - gw) / 2); gy = H > 700 ? 22 : H > 600 ? 10 : 0; // clear of the notch / status bar
  } else {
    gh = H; gw = Math.round(H * VW / VH); if (gw > W) { gw = W; gh = Math.round(W * VH / VW); }

// =====================================================================
//  ROOMS  -  幽霊屋敷 東棟 (EAST WING). One map cell = one screen (24 x 18 tiles).
//  Each room is built with a tiny DSL so it stays easy to edit:
//    R.box()                  walls all round (ceiling rows 0-1, floor rows 15-17 of every bottom cell)
//    R.open(side, cell, a, b) carve a passage: side 'L'/'R' = rows a..b of that cell row; 'T'/'B' = cols a..b of that cell column
//    R.plat(c0, c1, r)        one-way wooden platform        R.solid(c0, r0, c1, r1) solid block      R.clear(...) empty
//    R.secret(c, r0, r1)      secret wall (solid until revealed)   R.lock(c, r0, r1) locked door (opens with the key)
//  ents:  [type, col, row, opts]  feet / bottom at the top edge of 'row' (floaters: centre)
//  decor: [sprite, col, row, opts] bottom-centre at (col*16, row*16); opts.hang draws a chain up to the ceiling

// =====================================================================
const ROOM_BY_ID = {}; for (const d of ROOM_DEFS) ROOM_BY_ID[d.id] = d;
// cell -> room id
const CELL_ROOM = {};
for (const d of ROOM_DEFS) for (let y = 0; y < d.ch; y++) for (let x = 0; x < d.cw; x++) CELL_ROOM[(d.cx + x) + ',' + (d.cy + y)] = d.id;
const TOTAL_CELLS = Object.keys(CELL_ROOM).length;

const WORLD = (() => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const d of ROOM_DEFS) { x0 = Math.min(x0, d.cx); y0 = Math.min(y0, d.cy); x1 = Math.max(x1, d.cx + d.cw - 1); y1 = Math.max(y1, d.cy + d.ch - 1); } return { x0, y0, x1, y1, cols: x1 - x0 + 1, rows: y1 - y0 + 1 }; })();

// tile codes
const T_EMPTY = 0, T_SOLID = 1, T_PLAT = 2, T_SECRET = 3, T_LOCK = 4, T_GATE = 5;
const isSolidT = t => t === T_SOLID || t === T_SECRET || t === T_LOCK || t === T_GATE;
function buildRoomGrid(def) {
  const cols = def.cw * CC, rows = def.ch * CR, grid = new Uint8Array(cols * rows), gates = {};
  const set = (c, r, t) => { if (c >= 0 && c < cols && r >= 0 && r < rows) grid[r * cols + c] = t; };
  const R = {
    fill(c0, r0, c1, r1, t) { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) set(c, r, t); },
    box() {
      R.fill(0, 0, cols - 1, 1, T_SOLID); R.fill(0, 0, 0, rows - 1, T_SOLID); R.fill(cols - 1, 0, cols - 1, rows - 1, T_SOLID);
      R.fill(0, rows - 3, cols - 1, rows - 1, T_SOLID);
    },
    open(side, cell, a, b) {
      if (side === 'L') R.fill(0, cell * CR + a, 0, cell * CR + b, T_EMPTY);
      else if (side === 'R') R.fill(cols - 1, cell * CR + a, cols - 1, cell * CR + b, T_EMPTY);
      else if (side === 'T') R.fill(cell * CC + a, 0, cell * CC + b, 1, T_EMPTY);
      else if (side === 'B') R.fill(cell * CC + a, rows - 3, cell * CC + b, rows - 1, T_EMPTY);
    },
    plat(c0, c1, r) { R.fill(c0, r, c1, r, T_PLAT); },
    solid(c0, r0, c1, r1) { R.fill(c0, r0, c1, r1, T_SOLID); },
    clear(c0, r0, c1, r1) { R.fill(c0, r0, c1, r1, T_EMPTY); },
    secret(c, r0, r1) { R.fill(c, r0, c, r1, T_SECRET); },
    lock(c, r0, r1) { R.fill(c, r0, c, r1, T_LOCK); },
    gate(c0, r0, c1, r1, id) { R.fill(c0, r0, c1, r1, T_GATE); const l = gates[id] || (gates[id] = []); for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (c >= 0 && c < cols && r >= 0 && r < rows) l.push(r * cols + c); },
  };
  def.build(R);
  return { cols, rows, grid, gates };
}
// openings on each edge, for the map + door matching: [{side, cell, a, b}] (a..b tile range along that edge)
function roomOpenings(def, G) {
  const out = [], { cols, rows, grid } = G, at = (c, r) => grid[r * cols + c];
  const scan = (side, n, get) => { let a = -1; for (let i = 0; i <= n; i++) { const open = i < n && (get(i) === T_EMPTY || get(i) === T_SECRET || get(i) === T_LOCK || get(i) === T_GATE); if (open && a < 0) a = i; if (!open && a >= 0) { out.push({ side, a, b: i - 1 }); a = -1; } } };
  scan('L', rows, r => at(0, r)); scan('R', rows, r => at(cols - 1, r)); scan('T', cols, c => at(c, 0)); scan('B', cols, c => at(c, rows - 1));
  for (const o of out) o.cell = Math.floor(o.a / (o.side === 'L' || o.side === 'R' ? CR : CC));
  return out;
}

//  tiles / collision

function tileAt(c, r) {

// AABB vs solid tiles

  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (isSolidT(tileAt(c, r))) return true;
  return false;
}

  const prevBottom = b.y + b.h, isP = b === P;

    if (oneWay && isP) for (const f of floats) if (b.x + b.w > f.x + 1 && b.x < f.x + f.w - 1 && prevBottom <= f.y + 0.5 && b.y + b.h >= f.y) { b.y = f.y - b.h; b.vy = 0; b.onGround = true; b.onFloat = f; break; }

    }

    if (boxHitsSolid(b.x, b.y, b.w, b.h)) { const r = Math.floor(b.y / TS); b.y = (r + 1) * TS + 0.01; b.vy = 0; b.hitCeil = true; }

function exitRoom(side) {

  else if (side === 'R') { cx = d.cx + d.cw; cy = d.cy + clamp(Math.floor(pcy / CELL_H), 0, d.ch - 1); }

function drawFloorMark(x, k, col) { const xx = x - cam.x, yy = FLOOR_Y - cam.y; g.fillStyle = (frame & 4) ? col : 'rgba(255,230,160,0.6)'; g.beginPath(); g.ellipse(xx, yy - 1, 6 + k * 7, 2 + k, 0, 0, 7); g.fill(); }

// =====================================================================
//  BOSS 2: リネン・ゴーレム LINEN GOLEM (great washroom) - a heap of haunted laundry that walks
//    slam    : arms rise + red flash -> slams the floor: shockwaves both ways (jump). A bottle falls off the shelf (ammo)

//    leap    : (v0.3b, phase 2) a red mark under Kanata -> the golem jumps onto it: landing quake + suds both ways
//    combo   : (v0.3b, phase 2) the double slam flows straight into the sock rain
//    roll    : (every 3rd) spins up into a laundry ball (dust + red flash) -> rolls across the room (jump over it)
//              -> smacks the wall, unravels DIZZY: the sock-ghost core pops out = weak point (tug-of-war)
// =====================================================================
BOSS_DEFS.golem = { jp: 'リネン・ゴーレム', en: 'LINEN GOLEM', cfg: 'golem', cols: ['#e8f4ff', '#a8c8e8', '#ffffff', '#7ab0d8'], rageText: 'ゴーレムが怒った！ 泡だらけになった',
  sayIntro: '……洗濯物の山が、立ち上がった。……ちょっと、くさい', sayCore: '……くつした？ ……吸っちゃえ',
  make(b) { b.face = -1; b.vx = 0; b.ball = false; b.jy = 0; },
  hitBox(b) { return b.ball ? { x0: b.x - 22, x1: b.x + 22, y0: FLOOR_Y - 44, y1: FLOOR_Y } : { x0: b.x - 28, x1: b.x + 28, y0: FLOOR_Y - 76 - b.jy, y1: FLOOR_Y - b.jy }; },
  aim(b) { return { x: b.x, y: b.ball ? FLOOR_Y - 22 : FLOOR_Y - 46 - b.jy }; },
  update(b) {
    const C = CONFIG.golem, dx = pcx() - b.x;

    switch (b.state) {
      case 'idle': walk(bossP('walk')); if (b.t >= bossP('idle')) chooseAttack(b, b.rage ? ['slam', 'bubbles', 'socks', 'leap'] : ['slam', 'bubbles', 'socks'], 'roll'); break;
      case 'slam': {
        const warn = bossP('slamWarn'); if (b.t === 1) { b.face = Math.sign(dx) || b.face; sfx('warn'); }
        if (b.t < warn && b.t % 10 === 0) sfx('warn');
        if (b.t === warn || (b.rage && b.t === warn + 30)) { sfx('boom'); cam.shake = 9; hitStop = 3;
          for (const d of [-1, 1]) ebullets.push({ kind: 'suds', x: b.x + d * 30 - 8, y: FLOOR_Y - 14, w: 16, h: 14, vx: d * C.waveSpeed * (b.rage ? 1.15 : 1), vy: 0, dmg: C.slamDamage, life: 220 });

          for (let i = 0; i < 18; i++) parts.push({ x: b.x + rnd(-40, 40), y: FLOOR_Y - 4, vx: rnd(-2, 2), vy: rnd(-3, -0.5), life: 30, col: i & 1 ? '#e8f4ff' : '#8ac0e8', size: 2, grav: 1 });
          if (b.t === warn) { const fx = clamp(pcx() + (Math.random() < 0.5 ? -1 : 1) * rnd(56, 90), 30, room.W - 30); ebullets.push({ kind: 'dropbottle', x: fx - 4, y: 40, w: 8, h: 14, vx: 0, vy: 0.5, g: 0.2, dmg: 1, life: 200, suckable: true, ammo: 'bottle', onLand: q => spawnItem('bottle', q.x + 4, FLOOR_Y) }); } }
        if (b.t >= warn + (b.rage ? 50 : 40)) { b.state = b.rage ? 'socks' : 'idle'; b.t = 0; } break; }
      case 'bubbles': {
        if (b.t === 1) sfx('warn');
        const n = bossP('bubbles'), t0 = 34;
        if (b.t >= t0 && (b.t - t0) % 14 === 0 && (b.t - t0) / 14 < n) { sfx('bubble');
          const bx = b.x + b.face * 26, by = FLOOR_Y - 58;
          ebullets.push({ kind: 'bubble', x: bx - 8, y: by - 8, w: 16, h: 16, vx: b.face * 0.9, vy: rnd(-0.6, 0.2), g: 0, dmg: C.bubbleDamage, life: 330, suckable: true, ammo: 'soap', home: 1, homeMax: C.bubbleSpeed || 0.9, static: 1,
            onExpire: q => { if (Math.random() < 0.5) spawnItem('soap', q.x + 8, q.y + 16); for (let k = 0; k < 6; k++) parts.push({ x: q.x + 8, y: q.y + 8, vx: rnd(-1, 1), vy: rnd(-1, 1), life: 14, col: '#e8fbff', size: 1 }); } }); }
        if (b.t >= t0 + n * 14 + 30) { b.state = 'idle'; b.t = 0; } break; }
      case 'socks': {
        const warn = bossP('sockWarn');
        if (b.t === 1) { const n = bossP('socks'), px = pcx(); b.marks = []; const xs = [px]; for (let k = 1; xs.length < n; k++) { xs.push(px + k * 56); if (xs.length < n) xs.push(px - k * 56); }
          for (const x of xs) b.marks.push(clamp(x, 24, room.W - 24)); sfx('warn'); }
        if (b.t < warn && b.t % 12 === 0) sfx('warn');
        if (b.t === warn) { for (const mx of b.marks) ebullets.push({ kind: 'sock', x: mx - 5, y: 2 * TS + 2, w: 10, h: 12, vx: 0, vy: 1.4, g: 0.24, dmg: C.sockDamage, life: 200, onLand: q => { for (let k = 0; k < 5; k++) parts.push({ x: q.x + 5, y: FLOOR_Y - 2, vx: rnd(-1.2, 1.2), vy: rnd(-1.6, -0.4), life: 16, col: '#9ad0ff', size: 1, grav: 1 }); } }); b.marks = []; sfx('splash'); }
        if (b.t >= warn + 46) { b.state = 'idle'; b.t = 0; } break; }
      case 'leap': {
        const warn = bossP('leapWarn'), air = 40;
        if (b.t === 1) { b.marks = [clamp(pcx(), 44, room.W - 44)]; b.lx0 = b.x; sfx('warn'); tip('gleap', 'ゴーレムが跳ぶ！ 赤い印から離れて、着地の泡はジャンプでかわせ'); }

        if (b.t === warn + air) { b.jy = 0; b.x = b.lx1; b.lx0 = b.x; b.marks = []; sfx('boom'); cam.shake = 12; hitStop = 4;
          if (overlapBox(b.x - 40, FLOOR_Y - 76, b.x + 40, FLOOR_Y)) hurtPlayer(C.leapDamage, b.x, 'leap');
          for (const d of [-1, 1]) ebullets.push({ kind: 'suds', x: b.x + d * 44 - 8, y: FLOOR_Y - 14, w: 16, h: 14, vx: d * C.waveSpeed, vy: 0, dmg: 1, life: 220 });
          const fx = clamp(pcx() + (Math.random() < 0.5 ? -1 : 1) * rnd(56, 90), 30, room.W - 30); ebullets.push({ kind: 'dropbottle', x: fx - 4, y: 40, w: 8, h: 14, vx: 0, vy: 0.5, g: 0.2, dmg: 1, life: 200, suckable: true, ammo: 'bottle', onLand: q => spawnItem('bottle', q.x + 4, FLOOR_Y) });
          for (let i = 0; i < 20; i++) parts.push({ x: b.x + rnd(-40, 40), y: FLOOR_Y - 4, vx: rnd(-2.5, 2.5), vy: rnd(-3, -0.5), life: 30, col: i & 1 ? '#e8f4ff' : '#8ac0e8', size: 2, grav: 1 }); }
        if (b.t >= warn + air + 30) { b.state = 'idle'; b.t = 0; } break; }
      case 'roll': {
        const warn = bossP('spinWarn');
        if (b.t === 1) { b.face = Math.sign(dx) || b.face; b.bounced = !b.rage; sfx('warn'); }
        if (b.t < warn) { if (b.t % 8 === 0) sfx('warn'); if (b.t > warn * 0.4) b.ball = true; if (frame % 2 === 0) parts.push({ x: b.x + rnd(-24, 24), y: FLOOR_Y - rnd(0, 8), vx: rnd(-1.5, 1.5), vy: -rnd(0.2, 1), life: 18, col: '#a8a0b0', size: 2 }); break; }
        b.ball = true; b.x += b.face * bossP('spinSpeed');
        if (overlapBox(b.x - 20, FLOOR_Y - 40, b.x + 20, FLOOR_Y)) hurtPlayer(C.spinDamage, b.x, 'roll');
        if ((b.x < 36 || b.x > room.W - 36) && !b.bounced) { b.x = clamp(b.x, 36, room.W - 36); b.bounced = true; b.face = -b.face; sfx('crash'); cam.shake = 7; break; }
        if (b.x < 36 || b.x > room.W - 36) { b.x = clamp(b.x, 36, room.W - 36); b.state = 'dizzy'; b.t = 0; b.ball = false; b.winLen = bossP('dizzy'); sfx('crash'); cam.shake = 10; hitStop = 4;
          b.core = makeCore(b, b.x - b.face * 34, FLOOR_Y - 30, () => ({ x: boss.x, y: FLOOR_Y - 40 }), 'gcore');
          tip('gcore', 'ゴーレムが目を回した！ 中のくつ下ゴーストを VAC で吸い込め！', true); }
        break; }
      case 'dizzy': coreBob(b, b.x - b.face * 34, FLOOR_Y - 30); if (coreWindowOver(b)) { b.state = 'reform'; b.t = 0; } break;
      case 'reform': if (b.t > 50) { b.state = 'idle'; b.t = 0; } break;
    }
    if ((b.state === 'idle' || b.state === 'bubbles' || (b.state === 'leap' && b.jy > 30)) && overlapBox(b.x - 24, FLOOR_Y - 70 - b.jy, b.x + 24, FLOOR_Y - b.jy)) hurtPlayer(C.contactDamage, b.x, 'golem');
  },
  dying(b) { b.ball = false; },
  onDefeat(b) { bossReward(b, b.x); say('……洗濯物、ぜんぶ畳んだ。……ふぅ', 200); tip('golemDown', 'リネン・ゴーレムをやっつけた！ 屋敷のどこかで、まだ気配がする…', true); },
  draw(b, lights) {
    const x = Math.round(b.x - cam.x), y = Math.round(FLOOR_Y - cam.y), fl = b.face > 0;
    if (b.state === 'leap' && b.marks.length) drawFloorMark(b.marks[0], Math.min(1, b.t / bossP('leapWarn')), 'rgba(255,60,60,0.85)');

    if (b.state === 'roll' && b.t < bossP('spinWarn')) { g.fillStyle = 'rgba(255,80,80,0.35)'; const dir = b.face; for (let i = 0; i < 8; i++) if (((frame >> 2) + i) % 3 === 0) g.fillRect(x + dir * (30 + i * 16), y - 3, 8, 2); }
    let key;
    if (b.state === 'dying' && b.t >= 90) return;
    if (b.ball) key = 'golem_ball' + ((frame >> 2) & 3);
    else if (b.state === 'slam') key = b.t < bossP('slamWarn') ? 'golem_raise' : 'golem_slam';
    else if (b.state === 'leap') key = b.jy > 0 ? 'golem_raise' : 'golem_slam';
    else if (b.state === 'bubbles') key = 'golem_puff';
    else if (b.state === 'dizzy' || b.state === 'dying' || b.state === 'reform') key = 'golem_dizzy';
    else key = 'golem_idle' + ((frame >> 4) & 1);
    const r = rectOf('boss', key); let sx = x - (r.w >> 1), sy = y - r.h - Math.round(b.jy || 0);

    spr('boss', key, sx, sy, fl);
    if (b.flash > 0 && (frame & 2)) { g.globalAlpha = 0.7; sprWhite('boss', key, sx, sy, fl); g.globalAlpha = 1; }
    if ((b.state === 'slam' && b.t < bossP('slamWarn') && (frame & 4)) || (b.state === 'roll' && b.t < bossP('spinWarn') && (frame & 4))) { g.globalAlpha = 0.4; sprWhite('boss', key, sx, sy, fl, '#ff4040'); g.globalAlpha = 1; }
    if (b.state === 'dizzy') for (let i = 0; i < 4; i++) { const an = frame * 0.12 + i * 1.57; g.fillStyle = '#ffe080'; g.fillRect(Math.round(x + Math.cos(an) * 22), Math.round(y - 74 + Math.sin(an) * 4), 2, 2); }

// =====================================================================
//  BOSS 3: 夜咲きの女王 マダム・ローズ MADAME ROSE (night-bloom rose bed) - a giant haunted rose, rooted in the bed
//    thorns : glowing marks on the floor -> thorn spikes burst out of the ground
//    seeds  : the bulb swells -> seed pods arc toward Kanata; the ones that land become SEED ammo (they burn!)

//             afterwards she burrows and comes up on the other side of the bed.
//    roots  : (v0.3b) the stem glows -> a root ridge races along the floor toward the far wall (jump it; two when enraged)
//    garden : (v0.3b, phase 2) thorns over the whole bed in two alternating passes - stand between, then shift
//    combo  : (v0.3b, phase 2) seeds flow straight into thorns; 2-3 thorn waves
//  Fire is super effective (burnBonus).
// =====================================================================
BOSS_DEFS.rose = { jp: '夜咲きの女王 マダム・ローズ', en: 'MADAME ROSE', cfg: 'rose', cols: ['#ff5d8a', '#ffb0c8', '#6ad08a', '#ffffff'], rageText: 'マダム・ローズが怒った！ 花びらが真っ赤に',
  sayIntro: '……おっきいバラ。……お水、あげすぎた？', sayCore: '……花の中に、ゴーストがいた',
  make(b) { b.x = 300; b.side = 1; b.headY = FLOOR_Y - 110; b.droop = 0; b.burrow = 0; },
  head(b) { return { x: b.x - b.side * 6, y: b.headY + b.droop * 70 }; },
  hitBox(b) { const h = this.head(b); return { x0: h.x - 30, x1: h.x + 30, y0: h.y - 26, y1: Math.max(h.y + 26, FLOOR_Y - 10) }; },
  aim(b) { if (b.burrow) return null; const h = this.head(b); return { x: h.x, y: h.y }; },
  update(b) {
    const C = CONFIG.rose, D = this;
    switch (b.state) {
      case 'idle': if (b.t >= bossP('idle')) chooseAttack(b, b.rage ? ['thorns', 'seeds', 'petals', 'roots', 'garden'] : ['thorns', 'seeds', 'petals', 'roots'], 'bloom'); break;
      case 'thorns': {
        const warn = bossP('thornWarn');
        if (b.t === 1) b.wave = 0;
        if (b.t === 1 || b.t === b.retgt) { const n = bossP('thorns'), px = pcx(); b.marks = [clamp(px, 20, room.W - 20)]; for (let k = 1; b.marks.length < n; k++) { b.marks.push(clamp(px + k * C.thornGap, 20, room.W - 20)); if (b.marks.length < n) b.marks.push(clamp(px - k * C.thornGap, 20, room.W - 20)); } sfx('warn'); }
        if (b.t < warn && b.t % 12 === 0) sfx('warn');
        if (b.t === warn) { for (const mx of b.marks) ebullets.push({ kind: 'thorn', x: mx - 8, y: FLOOR_Y - 44, w: 16, h: 44, vx: 0, vy: 0, g: 0, dmg: C.thornDamage, life: 34, static: 1 }); b.marks = []; sfx('thorn'); cam.shake = 4; }
        if (b.t >= warn + 40) { if (b.wave < (b.rage ? 2 : 1)) { b.wave++; b.t = b.retgt = 4; } else { b.state = 'idle'; b.t = 0; b.retgt = -1; } } break; }
      case 'seeds': {
        if (b.t === 1) sfx('warn');
        const n = bossP('seeds');
        if (b.t === 36) { const h = D.head(b); sfx('spit');
          for (let i = 0; i < n; i++) { const tx = clamp(pcx() + (i - (n - 1) / 2) * 36, 20, room.W - 20), tf = 56, gg = 0.12, vx = (tx - h.x) / tf, vy = (FLOOR_Y - 8 - h.y - 0.5 * gg * tf * tf) / tf;
            ebullets.push({ kind: 'seedpod', x: h.x - 5, y: h.y - 5, w: 10, h: 10, vx, vy, g: gg, dmg: C.seedDamage, life: 200, suckable: true, ammo: 'seed', tx, onLand: q => { spawnItem('seed', q.x + 5, FLOOR_Y); sfx('hit'); } }); } }
        if (b.t >= 80) { b.state = b.rage ? 'thorns' : 'idle'; b.t = 0; } break; }
      case 'petals': {
        const warn = bossP('petalWarn');
        if (b.t === 1) { b.petalHigh = Math.random() < 0.45; sfx('warn'); }
        if (b.t < warn && b.t % 12 === 0) sfx('warn');
        if (b.t >= warn && b.t < warn + 48 && (b.t - warn) % 8 === 0) { const h = D.head(b), y = b.petalHigh ? FLOOR_Y - 76 : FLOOR_Y - 14;
          ebullets.push({ kind: 'petal', x: h.x - 6, y: y + rnd(-3, 3), w: 12, h: 8, vx: -b.side * bossP('petalSpeed') * (b.rage ? 1.2 : 1), vy: 0, g: 0, dmg: C.petalDamage, life: 260, static: 1, wall: 1 }); sfx('flap'); }
        if (b.rage && b.t === warn + 50) { b.petalHigh = !b.petalHigh; sfx('warn'); }  // v0.3 rage: a second stream at the other height

          ebullets.push({ kind: 'petal', x: h.x - 6, y: y + rnd(-3, 3), w: 12, h: 8, vx: -b.side * bossP('petalSpeed') * (b.rage ? 1.2 : 1), vy: 0, g: 0, dmg: C.petalDamage, life: 260, static: 1, wall: 1 }); sfx('flap'); }
        if (b.t >= warn + (b.rage ? 150 : 80)) { b.state = 'idle'; b.t = 0; } break; }
      case 'roots': {
        const warn = bossP('rootWarn'), dir = -b.side;
        if (b.t === 1) { sfx('warn'); tip('roots', '根っこが床を走ってくる！ ジャンプでかわせ'); }
        if (b.t === warn || (b.rage && b.t === warn + 34)) { sfx('thorn'); cam.shake = 3;
          ebullets.push({ kind: 'root', x: b.x + dir * 20 - 8, y: FLOOR_Y - 16, w: 16, h: 16, vx: dir * C.rootSpeed * (b.t > warn ? 1.15 : 1), vy: 0, dmg: C.rootDamage, life: 260 }); }
        if (b.t >= warn + (b.rage ? 80 : 50)) { b.state = 'idle'; b.t = 0; } break; }
      case 'garden': {
        const warn = bossP('gardenWarn');
        if (b.t === 1 || b.t === warn + 30) { const off = b.t === 1 ? 0 : 24; b.marks = []; b.markR = 16; for (let x = 16 + off; x < room.W - 12; x += 48) if (Math.abs(x - b.x) > 30) b.marks.push(x); b.gT = b.t; sfx('warn'); tip('garden', 'バラ園じゅうにトゲ！ 印と印のあいだに立て'); }
        if (b.t === b.gT + warn) { for (const mx of b.marks) ebullets.push({ kind: 'thorn', x: mx - 8, y: FLOOR_Y - 44, w: 16, h: 44, vx: 0, vy: 0, g: 0, dmg: C.thornDamage, life: 34, static: 1 }); b.marks = []; sfx('thorn'); cam.shake = 5; }

        b.droop = Math.min(1, (b.t - 50) / 24);
        if (b.t === 74) { b.state = 'wilt'; b.t = 0; b.winLen = bossP('bloom'); const h = D.head(b);
          b.core = makeCore(b, h.x - b.side * 30, FLOOR_Y - 30, () => { const hh = BOSS_DEFS.rose.head(boss); return { x: hh.x, y: hh.y }; }, 'rcore');
          tip('rcore', 'バラがしおれた！ 花の中のゴーストを VAC で吸い込め！', true); }
        break; }
      case 'wilt': { const h = D.head(b); coreBob(b, h.x - b.side * 30, FLOOR_Y - 30); if (coreWindowOver(b)) { b.state = 'burrow'; b.t = 0; } break; }

BOSS_DEFS.organ = { jp: '呪いのパイプオルガン', en: 'CURSED PIPE ORGAN', cfg: 'organ', cols: ['#d8b8ff', '#c8b088', '#ffffff', '#6a3a54'], rageText: 'オルガンが怒った！ 音が割れている',

//               Exhausted, the eye shuts: its EYE CORE drops out = weak point (tug-of-war)
//    rage     : (50%) the clock face cracks, shorter warnings, more orbs / swings
// =====================================================================
const CHR_PIVOT = { x: 192, y: 40 }, CHR_PLEN = 170;
// v0.4.2 final art (assets/gaiden_src/chronoa.png, 128x80 cells, right-facing, feet (64,79), used 1:1). Spawn points from the

const CHR_ART = { watch: [111, 61], glyph: [108, 41], beam: [121, 35], eyeBeam: [102, 35], eyeIdle: [26, 44], cracked: [98, 64] };
function chrPt(b, p, face) { const f = face || b.face; return { x: b.cx - 64 + (f > 0 ? p[0] : 127 - p[0]), y: FLOOR_Y - 79 + p[1] }; }
// where the clock mimic's eye is right now (behind her, or floating in front while she charges / fires the beam)
function chrEye(b) { return chrPt(b, b.pose === 'beam' || b.pose === 'charge' ? CHR_ART.eyeBeam : CHR_ART.eyeIdle); }
BOSS_DEFS.chronoa = { jp: '時計塔管理人 クロノア', en: 'CHRONOA, KEEPER OF THE CLOCK TOWER', cfg: 'chronoa', cols: ['#56d0c0', '#f3d98a', '#ffffff', '#b07a52'],
  rageText: '時計の目が怒りに燃えた！ クロノアが少しだけ本気になった',

  make(b) { b.cx = 290; b.cy = FLOOR_Y; b.tx = 290; b.face = -1; b.eye = 'open'; b.zones = []; b.orbs = []; b.pose = 'idle'; b.markR = 20; b.hand = 0; const e = chrEye(b); b.mx = e.x; b.my = e.y; },
  intro(b) { if (b.t === 20) storySay('chronoa', '……まだ、終わってないよ。急いでる人、嫌い……', 230); b.face = Math.sign(pcx() - b.cx) || b.face; },
  hitBox(b) { const e = chrEye(b); return { x0: Math.min(b.cx - 14, e.x - 19), x1: Math.max(b.cx + 14, e.x + 19), y0: Math.min(FLOOR_Y - 70, e.y - 21), y1: FLOOR_Y }; },
  aim(b) { return b.state === 'shut' ? null : { x: b.mx, y: b.my }; },
  update(b) {
    const C = CONFIG.chronoa;
    const dxm = clamp(b.tx - b.cx, -1.1, 1.1); b.cx += dxm; b.moving = Math.abs(dxm) > 0.3;   // she walks (languidly) on the floor now
    if (b.state === 'idle') b.face = b.moving ? Math.sign(dxm) : (Math.sign(pcx() - b.cx) || b.face);
    { const e = chrEye(b); b.mx = e.x; b.my = e.y; }

            onLand: q => { for (let k = 0; k < 6; k++) parts.push({ x: q.x + 7, y: FLOOR_Y - 3, vx: rnd(-1.5, 1.5), vy: rnd(-2, -0.5), life: 16, col: '#ffd0e0', size: 2, grav: 1 }); sfx('tink'); if (plate) spawnItem('plate', clamp(q.x + 7, 24, room.W - 24), FLOOR_Y); } };
            b.flyers.push({ q, x0: b.x, y0: FLOOR_Y - 96, tx: mx }); ebullets.push(q); }

        if (b.t > warn && b.flyers) { const k = Math.min(1, (b.t - warn) / 24);
          for (const f of b.flyers) { f.q.x = f.x0 + (f.tx - f.x0) * k - 7; f.q.y = f.y0 + (60 - f.y0) * k - Math.sin(k * Math.PI) * 30;

      case 'spotlight': {
        const tr = C.spotTrack, lk = bossP('spotLock');
        if (b.t === 1) { b.spot = { x: pcx() }; b.markR = 34; b.pose = 'cast'; sfx('warn'); tip('mspot', 'スポットライトが追ってくる！ 点滅したら止まる… 光の下から逃げて！'); }
        if (b.t < tr) b.spot.x += clamp(pcx() - b.spot.x, -1.6, 1.6);
        if (b.t < tr + lk) { b.marks = [b.spot.x]; if (b.t % 8 === 0) sfx('warn'); }
        if (b.t === tr + lk) { b.marks = [b.spot.x]; ebullets.push({ kind: 'sandbag', x: b.spot.x - 20, y: 2 * TS, w: 40, h: 36, vx: 0, vy: 4, g: 0.45, dmg: C.bagDamage, life: 60,
          onLand: q => { sfx('boom'); cam.shake = 10; hitStop = 3; for (let i = 0; i < 18; i++) parts.push({ x: q.x + rnd(0, 40), y: FLOOR_Y - 4, vx: rnd(-2.5, 2.5), vy: rnd(-3, -0.5), life: 30, col: i & 1 ? '#c8a878' : '#e8d8b0', size: 2, grav: 1 }); } }); sfx('whoosh'); }
        if (b.t === tr + lk + 26) { b.marks = []; b.spot = null; b.state = 'slump'; b.t = 0; b.pose = 'slump'; b.markR = 22; b.winLen = bossP('stun'); sfx('crash');
          b.coreSide = Math.sign(pcx() - b.x) || 1; b.core = makeCore(b, b.x + b.coreSide * 40, FLOOR_Y - 30, () => ({ x: boss.x, y: FLOOR_Y - 50 }), 'mcore');
          tip('mcore', '糸がからまって座長がくずれ落ちた！ 仮面のコアを VAC で吸い込め！', true); }
        break; }
      case 'slump': coreBob(b, b.x + b.coreSide * 40, FLOOR_Y - 30); if (coreWindowOver(b)) { b.state = 'rise'; b.t = 0; } break;
      case 'rise': b.pose = b.t < 30 ? 'slump' : 'idle'; if (b.t > 50) { b.state = 'idle'; b.t = 0; } break;
    }
  },
  dying(b) { b.pose = 'slump'; b.marks = []; b.spot = null; b.jy = 0; b.flyers = null; },
  onDefeat(b) { bossReward(b, b.x); say('……糸、ぜんぶほどけた。……おつかれさま、座長さん', 220);
    tip('sealTheater', '時計塔の封印がひとつ解けた！（' + ['clock', 'marionette', 'orrery'].filter(k => progress.bosses.has(k)).length + ' / 3）', true);
    checkBossGates(); velAppear('marionette', b.x > 192 ? 60 : 324, FLOOR_Y); },
  draw(b, lights) {
    const C = CONFIG.marionette, x = Math.round(b.x - cam.x), y = Math.round(FLOOR_Y - cam.y);
    if (b.state === 'cut') for (const m of b.marks) drawFloorMark(m, Math.min(1, (b.t - b.mT) / bossP('cutWarn')), 'rgba(255,210,90,0.9)');
    if (b.state === 'masks') for (const m of b.marks) drawFloorMark(m, Math.min(1, b.t / bossP('maskWarn')), 'rgba(255,110,170,0.9)');
    if (b.state === 'dance' && b.marks.length) drawFloorMark(b.marks[0], Math.min(1, b.t / bossP('leapWarn')), 'rgba(255,60,60,0.85)');
    if (b.state === 'spotlight' && b.spot) { const lock = b.t >= C.spotTrack, sx = b.spot.x - cam.x, top = 2 * TS - cam.y;
      g.globalCompositeOperation = 'lighter'; g.fillStyle = lock ? ((frame & 2) ? 'rgba(255,120,120,0.30)' : 'rgba(255,240,200,0.30)') : 'rgba(255,240,190,0.16)';
      g.beginPath(); g.moveTo(sx - 6, top); g.lineTo(sx + 6, top); g.lineTo(sx + 30, y); g.lineTo(sx - 30, y); g.closePath(); g.fill(); g.globalCompositeOperation = 'source-over';
      drawFloorMark(b.spot.x, lock ? 1 : 0.5, 'rgba(255,60,60,0.9)'); lights.push({ x: b.spot.x, y: FLOOR_Y - 20, r: 50, warm: 1 }); }
    if (b.state === 'dying' && b.t >= 90) return;
    const key = b.pose === 'jump' ? 'str_jump' : b.pose === 'cast' ? 'str_cast' : b.pose === 'slump' ? 'str_slump' : 'str_idle' + ((frame >> 4) & 1);
    const r = rectOf('boss', key), sx = x - (r.w >> 1), sy = y - r.h - Math.round(b.jy) + (b.pose === 'slump' ? 0 : Math.round(Math.sin(frame * 0.07) * 2) - 2);
    // the control strings run up into the dark rigging (slack + tangled while slumped)
    g.strokeStyle = 'rgba(230,230,255,0.55)'; g.lineWidth = 1;
    for (const [ox, oy] of [[-20, 58], [20, 58], [-6, 6], [6, 6], [-10, 96], [10, 96]]) { g.beginPath(); g.moveTo(sx + 32 + ox, sy + oy);
      if (b.pose === 'slump') g.quadraticCurveTo(sx + 32 + ox * 2 + Math.sin(frame * 0.1 + ox) * 6, (sy + 2 * TS - cam.y) / 2, sx + 32 + ox * 0.3, 2 * TS - cam.y); else g.lineTo(sx + 32 + ox * 0.5, 2 * TS - cam.y); g.stroke(); }
    spr('boss', key, sx, sy, b.face < 0);
    if (b.flash > 0 && (frame & 2)) { g.globalAlpha = 0.7; sprWhite('boss', key, sx, sy, b.face < 0); g.globalAlpha = 1; }
    if (b.state === 'dance' && b.t < bossP('leapWarn') && (frame & 4)) { g.globalAlpha = 0.4; sprWhite('boss', key, sx, sy, b.face < 0, '#ff4040'); g.globalAlpha = 1; }
    if (b.state === 'slump') for (let i = 0; i < 4; i++) { const an = frame * 0.12 + i * 1.57; g.fillStyle = '#ffe080'; g.fillRect(Math.round(x + Math.cos(an) * 18), Math.round(y - 92 + Math.sin(an) * 4), 2, 2); }
    lights.push({ x: b.x, y: FLOOR_Y - 60 - b.jy, r: 60, warm: 1 });
    drawCore(b, lights, 'mcore');
  },
};

// =====================================================================
//  AREA BOSS (v0.4): 星喰いの天球儀 アストラ ASTRA, THE STAR-EATING ORRERY (星見の天文台 / observatory dome)
//    A brass orrery that swallowed a little sun and now wants the whole night sky. Not a friend character.
//    meteor   : blue marks -> shooting stars fall straight onto them
//    comet    : a dotted lane flashes (LOW = jump it / HIGH = stay on the floor) -> a comet streaks across from the far wall
//    orbit    : the planets come loose and roll along the floor from the walls, one after another (jump them)
//    supernova: (every 3rd) the sun swells, dotted rays fan out -> star shards fly down the rays.
//               Burnt out, the sun goes grey: its SUN CORE drops out = weak point (tug-of-war)
//    rage     : (50%) the sun turns red: shorter warnings, more stars / planets, faster comets
// =====================================================================
BOSS_DEFS.orrery = { jp: '星喰いの天球儀 アストラ', en: 'ASTRA, THE STAR-EATING ORRERY', cfg: 'orrery', cols: ['#ffd060', '#ff8a3a', '#ffffff', '#c9a24a'],
  rageText: 'アストラの太陽が赤く燃え上がった！',
  sayIntro: '……天球儀が、星を食べてる。……おなか、こわすよ', sayCore: '……太陽の中に、ゴースト……',
  make(b) { b.x = 192; b.y = 96; b.markR = 22; b.rays = null; b.lane = null; },
  hitBox(b) { return { x0: b.x - 30, x1: b.x + 30, y0: b.y - 30, y1: b.y + 30 }; },
  aim(b) { return b.state === 'stop' ? null : { x: b.x, y: b.y }; },
  update(b) {
    const C = CONFIG.orrery, px = clamp(pcx(), 16, room.W - 16);
    b.x = 192 + Math.sin(frame * 0.012) * 26; b.y = 96 + Math.sin(frame * 0.023) * 6;
    switch (b.state) {
      case 'idle': b.markR = 22; if (b.t >= bossP('idle')) chooseAttack(b, ['meteor', 'comet', 'orbit'], 'supernova'); break;
      case 'meteor': {
        const warn = bossP('meteorWarn');
        if (b.t === 1) { const n = bossP('meteors'), xs = [px]; for (let k = 1; xs.length < n; k++) { xs.push(px + k * 56); if (xs.length < n) xs.push(px - k * 56); }
          b.marks = xs.map(x => clamp(x, 18, room.W - 18)); b.marks0 = b.marks.slice(); b.markR = 18; b.second = 0; sfx('warn'); tip('ometeor', '青い印に流れ星が落ちてくる！ 印と印のあいだへ'); }
        if (b.t < warn && b.t % 12 === 0) sfx('tick');
        if (b.t === warn) { let i = 0; for (const mx of b.marks) { const gem = i++ === 0; ebullets.push({ kind: 'starshot', x: mx - 7, y: 2 * TS, w: 14, h: 14, vx: 0, vy: 5, g: 0.2, dmg: C.starDamage, life: 90,
          onLand: q => { if (gem) spawnItem('crystal', clamp(q.x + 7, 24, room.W - 24), FLOOR_Y); for (let k = 0; k < 6; k++) parts.push({ x: q.x + 7, y: FLOOR_Y - 3, vx: rnd(-1.5, 1.5), vy: rnd(-2, -0.5), life: 16, col: '#fff4a0', size: 2, glow: 1, grav: 1 }); } }); } sfx('whoosh'); }
        if (b.t === warn + 30) { b.marks = []; if (b.rage && !b.second) { b.second = 1; b.marks = b.marks0.map(x => clamp(x + 28, 18, room.W - 18)); b.t = warn - 30; } }   // rage: a 2nd volley in the gaps
        if (b.t >= warn + 56) { b.second = 0; b.state = 'idle'; b.t = 0; } break; }
      case 'comet': {
        const warn = bossP('cometWarn'), n = b.rage ? 2 : 1;
        if (b.t === 1) { b.cn = 0; b.cT = 1; }
        if (b.t === b.cT) { b.lane = { high: b.cn === 0 ? Math.random() < 0.5 : !b.lastHigh, dir: pcx() < 192 ? 1 : -1 }; b.lastHigh = b.lane.high; b.petalHigh = b.lane.high; sfx('warn');
          tip('ocomet', 'ほうき星！ 低い線ならジャンプ、高い線なら床でじっと'); }
        if (b.lane && b.t < b.cT + warn && (b.t - b.cT) % 10 === 0) sfx('tick');
        if (b.lane && b.t === b.cT + warn) { const L = b.lane, y = L.high ? FLOOR_Y - 60 : FLOOR_Y - 16;
          ebullets.push({ kind: 'comet', x: L.dir > 0 ? room.W - 16 - 26 : 16, y, w: 26, h: 14, vx: -L.dir * bossP('cometSpeed'), vy: 0, g: 0, dmg: C.cometDamage, life: 200, static: 1, wall: 1, high: L.high }); sfx('whoosh'); }
        if (b.lane && b.t === b.cT + warn + 120) { b.cn++; b.lane = null; if (b.cn < n) b.cT = b.t + 1; }
        if (b.cn >= n && !ebullets.some(q => q.kind === 'comet' && !q.dead)) { b.petalHigh = false; b.state = 'idle'; b.t = 0; } break; }
      case 'orbit': {
        const warn = bossP('orbitWarn'), n = bossP('planets');
        if (b.t === 1) { b.pn = 0; b.pdir = pcx() < 192 ? 1 : -1; b.pT = warn; sfx('warn'); tip('oorbit', '惑星が外れて床を転がってくる！ ジャンプでかわせ'); }
        if (b.t === b.pT && b.pn < n) { const d = b.pn % 2 ? -b.pdir : b.pdir;   // first one from the far wall
          ebullets.push({ kind: 'planet', x: d > 0 ? room.W - 34 : 16, y: FLOOR_Y - 18, w: 18, h: 18, vx: -d * bossP('planetSpeed'), vy: 0, g: 0, dmg: C.planetDamage, life: 400, static: 1, wall: 1, onExpire: q => spawnItem('gear', clamp(q.x + 9, 24, room.W - 24), FLOOR_Y) }); b.pn++; sfx('whoosh'); }
        if (b.t > warn && b.pn < n && !ebullets.some(q => q.kind === 'planet' && !q.dead) && b.t >= b.pT) b.pT = b.t + 30;
        if (b.pn >= n && b.t > b.pT + 2 && !ebullets.some(q => q.kind === 'planet' && !q.dead)) { b.state = 'idle'; b.t = 0; } break; }
      case 'supernova': {   // shards fly out along the rays to a point high above each mark, hang there, then drop straight down
        const warn = bossP('novaWarn'), sp = C.shardSpeed, HY = 64, hang = 16;
        if (b.t === 1) { const n = bossP('shards'), off = rnd(-20, 20); b.rays = []; b.rO = { x: b.x, y: b.y + 26 };
          for (let i = 0; i < n; i++) b.rays.push({ tx: clamp(192 + off + (i - (n - 1) / 2) * 60, 16, room.W - 16), k: 0, q: null, st: 0 });
          b.marks = b.rays.map(r => r.tx); b.markR = 18; sfx('warn'); tip('onova', '太陽がふくらむ！ 点線の先に星のかけらが降ってくる… 線と線のあいだへ'); }
        if (b.t < warn && b.t % 8 === 0) sfx('warn');

          for (const r of b.rays) { if (!r.q) continue; alive++;
            if (r.st === 0) { const L = Math.hypot(r.tx - b.rO.x, HY - b.rO.y) || 1; r.k = Math.min(1, r.k + sp / L);
              r.q.x = b.rO.x + (r.tx - b.rO.x) * r.k - 7; r.q.y = b.rO.y + (HY - b.rO.y) * r.k - 7; if (r.k >= 1) { r.st = 1; r.hold = hang; } }
            else if (r.st === 1) { if (--r.hold <= 0) { r.st = 2; r.q.static = 0; r.q.vy = 1; r.q.g = 0.4; r.q.life = 80;
              r.q.onLand = q => { for (let k = 0; k < 6; k++) parts.push({ x: q.x + 7, y: FLOOR_Y - 3, vx: rnd(-1.5, 1.5), vy: rnd(-2, -0.5), life: 16, col: '#fff4a0', size: 2, glow: 1, grav: 1 }); }; } }
            else if (r.q.dead) { r.q = null; alive--; } }
          if (!alive) { b.rays = null; b.marks = []; b.markR = 22; b.state = 'stop'; b.t = 0; b.winLen = bossP('stun'); sfx('crash'); cam.shake = 6;
            b.coreSide = Math.sign(pcx() - 192) || 1; b.core = makeCore(b, 192 + b.coreSide * 40, FLOOR_Y - 30, () => ({ x: boss.x, y: boss.y + 50 }), 'scor');
            tip('ocore', '太陽が燃えつきた！ こぼれ落ちた「太陽のコア」を VAC で吸い込め！', true); } }
        break; }
      case 'stop': coreBob(b, 192 + b.coreSide * 40, FLOOR_Y - 30); if (coreWindowOver(b)) { b.state = 'relight'; b.t = 0; } break;
      case 'relight': if (b.t > 50) { b.state = 'idle'; b.t = 0; } break;
    }
  },
  dying(b) { b.marks = []; b.rays = null; b.lane = null; },
  onDefeat(b) { bossReward(b, b.x); say('……星、みんな空にかえった。……きれい', 220);
    tip('sealStars', '時計塔の封印がひとつ解けた！（' + ['clock', 'marionette', 'orrery'].filter(k => progress.bosses.has(k)).length + ' / 3）', true);
    checkBossGates(); velAppear('orrery', pcx() < 192 ? 330 : 54, FLOOR_Y); },
  draw(b, lights) {
    const x = Math.round(b.x - cam.x), y = Math.round(b.y - cam.y);

// =====================================================================
//  v0.4 STORY: portrait dialogue box, ヴェル VEL's one-line appearances, the true ending.
//    ヴェル (主人付き秘書) is never fought. She appears in human form at key moments (new areas, after certain
//    bosses, before Chronoa), says ONE short polite cryptic line, and fades away.
//    Ending: Chronoa falls asleep, Vel comes for her; something invisible lifts Chronoa (no visible tentacles,
//    only a faint warping shadow) and they leave together.
// =====================================================================
const STORY = { box: null, queue: [], vel: null, scene: null };
const SPEAKERS = { vel: { name: 'ヴェル', col: '#d8c8e8', portrait: 'portrait_vel64' }, chronoa: { name: 'クロノア', col: '#7ae0d0', portrait: 'portrait_chronoa64' } };
const VEL_LINES = {
  first:   '見えているものが、すべてではありません。',
  theater: '……拍手は、幕が下りてからでも遅くはありません。',
  stars:   '星は、見られていることに気づいています。',
  marionette: '糸の切れた人形は、自由なのでしょうか。……それとも。',
  orrery:  '夜空の数を数えるのは、主のささやかなご趣味です。',
  clock:   '時計の針は、まだ止まっていませんよ。',
  chronoa: '……私の後ろには、立たないことをお勧めします。',
};
function storySay(who, text, frames) { const it = { who, text, t: frames || 260, T: frames || 260 }; if (STORY.box) STORY.queue.push(it); else STORY.box = it; }
// Vel appears once per save for each key, near (x, feet y), says her line, and fades out
function velAppear(key, x, y) {
  if (progress.perm.has('vel:' + key)) return false; progress.perm.add('vel:' + key);
  STORY.vel = { key, x: clamp(x, 30, room.W - 30), y, t: 0, life: 330 }; storySay('vel', VEL_LINES[key], 300); sfx('chime'); stats.velSeen = (stats.velSeen || 0) + 1;
  return true;
}
function storyRoomEnter(def) {
  STORY.vel = null;
